name: Build iOS IPA

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode version
        run: |
          xcodebuild -version
          xcodebuild -list -project WhatStickeriOS.xcodeproj

      - name: Build & Archive iOS App (Unsigned)
        run: |
          xcodebuild archive \
            -project WhatStickeriOS.xcodeproj \
            -scheme WhatStickeriOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/WhatStickeriOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package .ipa
        run: |
          APP_PATH="build/WhatStickeriOS.xcarchive/Products/Applications/WhatStickeriOS.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: $APP_PATH not found!"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -y WhatStickeriOS.ipa Payload
          ls -lh WhatStickeriOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatStickeriOS-IPA
          path: build/WhatStickeriOS.ipa
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/WhatStickeriOS.ipa
          generate_release_notes: true
